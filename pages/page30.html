    <h1>蓋納斯與早期拜占庭蠻族權力危機 — Ludwica 的簡單歷史課</h1>
    <p>深入探討公元400年左右東羅馬哥德籍大將蓋納斯（Gainas）的崛起與覆滅，剖析東羅馬帝國軍隊蠻族化背景、尤特羅皮烏斯的崛起與朝政作為、崔比吉爾德叛亂、蓋納斯在君士坦丁堡的軍事專政、七月十二日反蠻族大屠殺、赫勒斯滂海戰，以及此事件對東部帝國走向官僚集權與限制蠻族干政的深遠地緣政治影響。</p>
