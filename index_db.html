    // 3. Social Media Share Utility Functions
    function shareTo(platform, pageId) {
        let baseUrl = window.location.origin + window.location.pathname;
        if (baseUrl.endsWith('.html')) {
            baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
        } else if (!baseUrl.endsWith('/')) {
            baseUrl += '/';
        }
        const shareUrl = pageId === 'home' ? baseUrl : `${baseUrl}pages/${pageId}.html`;
        const pageTitle = pageId === 'home' ? 'Ludwica 的簡單歷史課' : (pageSEO[pageId] ? pageSEO[pageId].title : document.title);

        if (platform === 'facebook') {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`, '_blank', 'width=600,height=400');
        } else if (platform === 'line') {
            window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl)}`, '_blank');
        } else if (platform === 'twitter') {
            window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(pageTitle)}`, '_blank', 'width=600,height=400');
        } else if (platform === 'copy') {
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('連結已複製到剪貼簿！');
            }).catch(err => {
                const input = document.createElement('input');
                input.value = shareUrl;
                document.body.appendChild(input);
                input.select();
                try {
                    document.execCommand('copy');
                    showToast('連結已複製到剪貼簿！');
                } catch (e) {
                    showToast('複製失敗，請手動複製網址');
                }
                document.body.removeChild(input);
            });
        }
    }

        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

            updateHash('home');
            updatePageSEO('home');
            return Promise.resolve();
        } else {
            if (courseHome) courseHome.style.display = 'none';
            if (courseViewport) courseViewport.style.display = 'block';

            // Temporary set class name
            courseViewport.className = 'course-page';

            return loadAndShowArticle(pageId).then(() => {
                generateTOC(pageId);
                initMobileCollapseForPage(pageId);
                makeExplanationsCollapsible();

                const infoDiv = document.getElementById('dynamic-course-info');
                if (infoDiv) {
                    const article = allArticlesList.find(a => a.id === pageId);
                    if (article) {
                        const label = article.is_doc ? '文件' : '課堂';
                        infoDiv.innerHTML = `
                            <div style="color: #4a5568;">
                                <b>📚 當前${label}：</b>${article.title}<br>
                                <b>🏷️ 內容版本：</b>${article.ver}<br>
                                <b>📅 更新日期：</b>${article.last_updated}<br>
                                <b>👤 內容生成：</b>AI 深度研究<br>
                                <b>🛠️ 網頁工程：</b>Antigravity 協作
                            </div>
                        `;
                    }
                }

                if (window.scrollY > 280) {
                    window.scrollTo({top: 260, behavior: 'smooth'});
                }

                updateHash(pageId);
                updatePageSEO(pageId);

                // If navigating to page27, initialize the relationship map
                if (pageId === 'page27') {
                    if (typeof initRelationshipMap === 'function') {
                        initRelationshipMap();
                    }
                }
            });
        }
    }

    function updateHash(hashVal) {
        const currentHash = window.location.hash.substring(1);
        if (!currentHash.startsWith(hashVal)) {
            window.history.pushState(null, null, '#' + hashVal);
        }
    }

    function loadAndShowArticle(pageId) {
        const container = document.getElementById('article-content-container');
        if (!container) return Promise.resolve();

        if (cachedArticles[pageId]) {
            container.innerHTML = cachedArticles[pageId];
            indexLoadedPageElements(pageId);
            return Promise.resolve();
        }

        container.innerHTML = `
            <div style="padding: 100px 40px; text-align: center; color: #718096;">
                <div class="loading-spinner" style="margin-bottom: 20px;"></div>
                <div style="font-weight: 600; margin-top: 10px;">正在從 Firestore 載入文章...</div>
            </div>
        `;

        return getArticleById(pageId)
            .then(article => {
                if (!article || !article.content_html) {
                    throw new Error('文章不存在或內容為空');
                }
                cachedArticles[pageId] = article.content_html;
                container.innerHTML = article.content_html;
                indexLoadedPageElements(pageId);
            })
            .catch(err => {
                container.innerHTML = `
                    <div style="padding: 60px 40px; text-align: center; color: #e53e3e;">
                        <span style="font-size: 3rem; display: block; margin-bottom: 15px;">⚠️</span>
                        <strong>無法載入文章</strong><br>
                        <span style="font-size: 0.9rem; color: #718096;">錯誤訊息: ${err.message}</span><br>
                        <button onclick="window.switchPage('${pageId}')" style="margin-top: 20px; padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">重試</button>
                    </div>
                `;
                console.error(err);
            });
    }
    window.switchPage = switchPage;

    function indexLoadedPageElements(pageId) {
        searchableElements = [];
        const pageEl = document.getElementById('article-content-container');
        const article = allArticlesList.find(a => a.id === pageId);
        if (pageEl && article) {
            const elements = pageEl.querySelectorAll('p, h2, h3, li, td');
            elements.forEach((el, index) => {
                if (!el.id) el.id = pageId + '-search-match-' + index;
                searchableElements.push({
                    element: el,
                    pageId: pageId,
                    pageName: article.title,
                    text: el.innerText
                });
            });
        }
    }

    // 5. Generate Table of Contents on the Fly
    function generateTOC(pageId) {
        const tocContainer = document.getElementById('toc');
        tocContainer.innerHTML = '';

        const activePage = document.getElementById('article-content-container');
        if (!activePage) return;

        const headings = activePage.querySelectorAll('h2, h3');
        headings.forEach((h, index) => {
            h.id = pageId + '-heading-' + index;
            const link = document.createElement('a');
            link.href = '#' + h.id;
            link.innerText = h.innerText;
            link.className = 'toc-item toc-' + h.tagName.toLowerCase();
            tocContainer.appendChild(link);
        });
    }

    // 6. Keyword Search Engine (Global Static JSON Search Index)
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchIndex = null; // Downloaded on-demand when user first types

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        searchResults.innerHTML = '';

        if (!keyword) {
            searchResults.innerHTML = '<div style="color:#a0aec0; text-align:center; margin-top:30px; font-size: 0.9rem;">輸入關鍵字以尋找內文段落</div>';
            return;
        }

        // Lazy load search index once (from Firestore)
        if (searchIndex === null) {
            searchResults.innerHTML = '<div style="text-align: center; padding: 20px 0;"><div class="loading-spinner"></div><div style="font-size:0.8rem;color:#718096;margin-top:8px;">正在從 Firestore 載入搜尋索引...</div></div>';
            getSearchIndex()
                .then(data => {
                    searchIndex = data;
                    // Re-trigger search input logic
                    searchInput.dispatchEvent(new Event('input'));
                })
                .catch(err => {
                    searchResults.innerHTML = '<div style="color:#e53e3e; text-align:center; margin-top:30px; font-size: 0.95rem;">搜尋錯誤：' + err.message + '</div>';
                });
            return;
        }

        // Local search in downloaded index
        let count = 0;
        searchIndex.forEach((item) => {
            const text = item.text;
            if (text.toLowerCase().includes(keyword)) {
                count++;
                if (count > 50) return; // Cap results

                const res = document.createElement('div');
                res.className = 'search-result-item';

                const idx = text.toLowerCase().indexOf(keyword);
                const start = Math.max(0, idx - 25);
                const end = Math.min(text.length, idx + keyword.length + 25);
                let snippet = text.substring(start, end);
                if (start > 0) snippet = '...' + snippet;
                if (end < text.length) snippet = snippet + '...';

                // Highlight keyword
                const escapedKeyword = keyword.replace(/[-\/\\^$*+?.()|[\\]{}]/g, '\\$&');
                const regex = new RegExp('(' + escapedKeyword + ')', 'gi');
                snippet = snippet.replace(regex, '<mark>$1</mark>');

                // Find page title from cached article metadata
                const article = allArticlesList.find(a => a.id === item.pageId);
                const pageTitle = article ? article.title : '歷史專題';

                res.innerHTML = `<span style="font-size: 0.72rem; display: block; font-weight: 600; color: var(--primary-color); margin-bottom: 3px;">📌 ${pageTitle}</span>` + snippet;

                res.onclick = () => {
                    switchPage(item.pageId).then(() => {
                        const pageEl = document.getElementById('article-content-container');
                        if (!pageEl) return;
                        const elements = pageEl.querySelectorAll('p, h2, h3, li, td');
                        let matchedEl = null;

                        for (let el of elements) {
                            if (el.innerText.toLowerCase().includes(keyword)) {
                                matchedEl = el;
                                break;
                            }
                        }

                        if (matchedEl) {
                            if (window.innerWidth <= 800) {
                                const parentH2 = getParentH2(matchedEl);
                                if (parentH2 && parentH2.classList.contains('collapsed')) {
                                    parentH2.click();
                                }
                            }

                            const sidebarRight = document.getElementById('sidebarRight');
                            const footerToggleBtn = document.getElementById('footerToggleBtn');
                            if (window.innerWidth <= 1200) {
                                if (sidebarRight && !sidebarRight.classList.contains('collapsed-footer')) {
                                    sidebarRight.classList.add('collapsed-footer');
                                    if (footerToggleBtn) footerToggleBtn.innerText = '展開 ▲';
                                }
                            }

                            setTimeout(() => {
                                matchedEl.scrollIntoView({behavior: 'smooth', block: 'center'});
                                const originalBg = matchedEl.style.backgroundColor;
                                matchedEl.style.transition = 'background-color 0.3s';
                                matchedEl.style.backgroundColor = '#fbd38d';
                                setTimeout(() => { matchedEl.style.backgroundColor = originalBg; }, 2000);
                            }, window.innerWidth <= 800 ? 50 : 0);
                        }
                    });
                };
                searchResults.appendChild(res);
            }
        });

        if (count === 0) {
            searchResults.innerHTML = '<div style="color:#e53e3e; text-align:center; margin-top:30px; font-size: 0.95rem;">找不到包含「' + e.target.value + '」的內容</div>';
        } else if (count > 50) {
            const note = document.createElement('div');
            note.style = "color:#718096; text-align:center; margin-top:10px; font-size: 0.8rem;";
            note.innerText = `找到超過 50 筆結果，僅顯示前 50 筆`;
            searchResults.appendChild(note);
        }
    });

    // 7. Mobile Collapse Utilities
    function getParentH2(element) {
        let prev = element.previousElementSibling;
        while (prev) {
            if (prev.tagName === 'H2') {
                return prev;
            }
            prev = prev.previousElementSibling;
        }
        return null;
    }

    function initMobileCollapseForPage(pageId) {
        const isMobile = window.innerWidth <= 800;
        const activePage = document.getElementById('article-content-container');
        if (!activePage) return;

        const h2s = activePage.querySelectorAll('h2');
        h2s.forEach(h2 => {
            if (!h2._contentElements) {
                const contentElements = [];
                let next = h2.nextElementSibling;
                while (next && next.tagName !== 'H2') {
                    contentElements.push(next);
                    next = next.nextElementSibling;
                }
                h2._contentElements = contentElements;

                h2.addEventListener('click', () => {
                    if (window.innerWidth <= 800) {
                        const isCollapsed = h2.classList.toggle('collapsed');
                        h2._contentElements.forEach(el => {
                            el.style.display = isCollapsed ? 'none' : '';
                        });
                    }
                });
            }

            h2.classList.remove('collapsed');
            h2._contentElements.forEach(el => el.style.display = '');
        });
    }

    let wasMobile = window.innerWidth <= 800;
    window.addEventListener('resize', () => {
        const isMobile = window.innerWidth <= 800;
        if (isMobile !== wasMobile) {
            wasMobile = isMobile;
            initMobileCollapseForPage(activePageId);
        }
    });

    // 8. Mobile Floating Drawer Collapse Toggle
    const sidebarRight = document.getElementById('sidebarRight');
    const footerHeader = document.getElementById('footerHeader');
    const footerToggleBtn = document.getElementById('footerToggleBtn');

    if (footerHeader && sidebarRight && footerToggleBtn) {
        const toggleFooter = () => {
            const isCollapsed = sidebarRight.classList.toggle('collapsed-footer');
            footerToggleBtn.innerText = isCollapsed ? '展開 ▲' : '收合 ▼';
        };
        footerHeader.addEventListener('click', toggleFooter);
    }

    // 9. Collapsible Explanations Accordion Transform
    function makeExplanationsCollapsible() {
        const viewport = document.getElementById('article-content-container');
        if (!viewport) return;
        viewport.querySelectorAll('.doc-explanation ul').forEach(ul => {
            ul.querySelectorAll('li').forEach(li => {
                const strong = li.querySelector('strong');
                if (strong && !li.querySelector('details')) { // check to avoid double transformation
                    const termHtml = strong.outerHTML;

                    const clone = li.cloneNode(true);
                    const cloneStrong = clone.querySelector('strong');
                    if (cloneStrong) cloneStrong.remove();

                    let contentHtml = clone.innerHTML.trim();
                    if (contentHtml.startsWith('：') || contentHtml.startsWith(':')) {
                        contentHtml = contentHtml.substring(1).trim();
                    }

                    li.innerHTML = `
                        <details class="explanation-details">
                            <summary class="explanation-summary">
                                <span class="explanation-term">${termHtml}</span>
                            </summary>
                            <div class="explanation-content">${contentHtml}</div>
                        </details>
                    `;
                }
            });
        });
    }

    // 10. Dynamic Category & Cards Rendering
    function renderCatalog(categories, articles) {
        const container = document.getElementById('articles-menu-container');
        if (!container) return;
        container.innerHTML = '';

        const tabMapping = {
            'us': 'new-world',
            'qing': 'far-east'
        };

        categories.forEach(cat => {
            const catPages = articles.filter(art => art.category === cat.key);

            let gridContent = '';
            if (catPages.length === 0) {
                gridContent = `<div style="text-align: center; color: #a0aec0; padding: 20px; width: 100%; grid-column: 1 / -1;">📝 本專題文章撰寫中，敬請期待！</div>`;
            } else {
                catPages.forEach(art => {
                    gridContent += makeCardHtml(art);
                });
            }

            const catSection = document.createElement('div');
            catSection.className = 'category-section';
            const tab = tabMapping[cat.key] || 'europe';
            catSection.setAttribute('data-tab', tab);
            catSection.innerHTML = `
                <div class="category-header-card" onclick="toggleCategory('${cat.key}')">
                    <div class="category-header-image" style="background-image: url('${cat.img}');"></div>
                    <div class="category-header-content">
                        <span class="category-header-title">${cat.title}</span>
                        <span class="category-header-icon" id="icon-${cat.key}">▼</span>
                    </div>
                </div>
                <div class="category-container" id="cat-${cat.key}" data-category="${cat.key}" style="display: none;">
                    <div class="article-grid">
                        ${gridContent}
                    </div>
                </div>
            `;
            container.appendChild(catSection);
        });

        // Append Historical Documents section
        const docPages = articles.filter(art => art.is_doc);
        if (docPages.length > 0) {
            let docGridContent = '';
            docPages.forEach(art => {
                docGridContent += makeCardHtml(art);
            });

            const docsSection = document.createElement('div');
            docsSection.innerHTML = `
                <div class="card-section-title" style="margin-top: 40px; margin-bottom: 20px; font-size: 1.3rem; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: var(--primary-color);">歷史文件專區</div>
                <div class="article-grid">
                    ${docGridContent}
                </div>
            `;
            container.appendChild(docsSection);
        }

        // Apply tab filtering based on active tab button
        const activeTabBtn = document.querySelector('.tab-btn.active');
        const activeTabId = activeTabBtn ? activeTabBtn.getAttribute('data-tab') : 'europe';
        switchTab(activeTabId);
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tabId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        let visibleCount = 0;
        document.querySelectorAll('#articles-menu-container .category-section').forEach(sec => {
            const secTab = sec.getAttribute('data-tab');
            if (secTab === tabId) {
                sec.style.display = 'block';
                visibleCount++;
            } else {
                sec.style.display = 'none';
            }
        });

        // Handle empty tab state
        let emptyMsg = document.getElementById('empty-tab-message');
        if (visibleCount === 0) {
            if (!emptyMsg) {
                emptyMsg = document.createElement('div');
                emptyMsg.id = 'empty-tab-message';
                emptyMsg.className = 'empty-tab-message';
                emptyMsg.innerHTML = '📭 遠東專題規劃中，敬請期待！';
                const menuContainer = document.getElementById('articles-menu-container');
                const titleNode = Array.from(menuContainer.childNodes).find(n => n.nodeType === 1 && n.innerText && n.innerText.includes('歷史文件專區'));
                if (titleNode) {
                    menuContainer.insertBefore(emptyMsg, titleNode);
                } else {
                    menuContainer.appendChild(emptyMsg);
                }
            } else {
                emptyMsg.style.display = 'block';
            }
        } else {
            if (emptyMsg) {
                emptyMsg.style.display = 'none';
            }
        }
    }

    // Bind event listeners to tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const tabId = e.currentTarget.getAttribute('data-tab');
            switchTab(tabId);
        });
    });

    function makeCardHtml(art) {
        if (art.is_doc) {
            return `
                <div class="article-card doc-card" onclick="location.hash='#${art.id}'">
                    <div class="card-content">
                        <div class="card-title">${art.title}</div>
                        <div class="card-meta">內容版本：${art.ver}</div>
                    </div>
                </div>`;
        } else {
            return `
                <div class="article-card" onclick="location.hash='#${art.id}'">
                    <div class="card-image" style="background-image: url('${art.img}');"></div>
                    <div class="card-content">
                        <div class="card-title">${art.title}</div>
                        <div class="card-meta">內容版本：${art.ver}</div>
                    </div>
                </div>`;
        }
    }

    // 11. Hash routing listener
    function handleHashRouting() {
        const hash = window.location.hash.substring(1);

        if (!hash) {
            if (activePageId !== 'home') switchPage('home');
            return;
        }

        if (hash === 'home') {
            if (activePageId !== 'home') switchPage('home');
            return;
        }

        const matchedPage = allArticlesList.find(art => hash.startsWith(art.id));
        if (matchedPage) {
            const pageId = matchedPage.id;
            if (activePageId !== pageId) {
                switchPage(pageId).then(() => {
                    setTimeout(() => {
                        const target = document.getElementById(hash);
                        if (target) target.scrollIntoView();
                    }, 50);
                });
            } else {
                const target = document.getElementById(hash);
                if (target) target.scrollIntoView();
            }
        } else {
            if (activePageId !== 'home') switchPage('home');
        }
    }

    window.addEventListener('hashchange', handleHashRouting);

    // 12. Startup Initialization via Firebase Firestore
    async function initFromFirestore() {
        try {
            // Parallel fetch: categories, articles catalog, worklog
            const [categories, articles, worklogHtml] = await Promise.all([
                getCategories(),
                getArticlesCatalog(),
                getWorklog()
            ]);

            allArticlesList = articles;

            // Render worklogs
            if (worklogHtml) {
                const uLog = document.getElementById('update-log-container');
                if (uLog) uLog.innerHTML = worklogHtml;
                const mLog = document.querySelector('.mobile-update-log-content');
                if (mLog) mLog.innerHTML = worklogHtml;
            }

            // Render dynamic navigation menu cards
            renderCatalog(categories, articles);

            console.log('🔥 Firebase Firestore 初始化完成');

            // Process initial route hash
            handleHashRouting();
        } catch (err) {
            console.error('Initialization error:', err);
            document.getElementById('articles-menu-container').innerHTML = `
                <div style="padding: 60px 40px; text-align: center; color: #e53e3e;">
                    <span style="font-size: 3rem; display: block; margin-bottom: 15px;">⚠️</span>
                    <strong>初始化失敗</strong><br>
                    <span style="font-size: 0.9rem; color: #718096;">無法從 Firestore 載入資料：${err.message}</span><br>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">重新載入</button>
                </div>
            `;
        }
    }

    // Fire on DOM ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initFromFirestore);
    } else {
        initFromFirestore();
    }

    // === Character Relationship Map Interactive Logic ===
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let initialTouchDist = 0;
    let initialScale = 1.0;
    let touchStartX = 0;
    let touchStartY = 0;

    function setupPanZoom() {
        const viewport = document.querySelector('.relationship-section .diagram-outer');
        const container = document.getElementById('diagramContainer');
        if (!viewport || !container || viewport.dataset.initialized) return;

        viewport.dataset.initialized = 'true';

        function updateTransform() {
            container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // Mouse Wheel Zoom
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const oldScale = scale;
            const zoomIntensity = 0.0005;
            const factor = Math.exp(-e.deltaY * zoomIntensity);
            scale = Math.min(Math.max(scale * factor, 0.15), 6.0);

            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
            translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

            updateTransform();
        }, { passive: false });

        // Mouse Drag to Pan
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('button')) return;
            isPanning = true;
            viewport.style.cursor = 'grabbing';
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            viewport.style.cursor = 'grab';
        });

        // Touch Gestures
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isPanning = true;
                touchStartX = e.touches[0].clientX - translateX;
                touchStartY = e.touches[0].clientY - translateY;
            } else if (e.touches.length === 2) {
                isPanning = false;
                initialTouchDist = getTouchDistance(e);
                initialScale = scale;

                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const rect = viewport.getBoundingClientRect();

                touchStartX = midX - rect.left;
                touchStartY = midY - rect.top;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isPanning && e.touches.length === 1) {
                translateX = e.touches[0].clientX - touchStartX;
                translateY = e.touches[0].clientY - touchStartY;
                updateTransform();
            } else if (e.touches.length === 2) {
                const dist = getTouchDistance(e);
                const factor = dist / initialTouchDist;
                const oldScale = scale;

                scale = Math.min(Math.max(initialScale * factor, 0.15), 6.0);

                translateX = touchStartX - (touchStartX - translateX) * (scale / oldScale);
                translateY = touchStartY - (touchStartY - translateY) * (scale / oldScale);

                updateTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', () => {
            isPanning = false;
        });

        function getTouchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
    }

    window.zoom = function(factor) {
        const viewport = document.querySelector('.relationship-section .diagram-outer');
        const container = document.getElementById('diagramContainer');
        if (!viewport || !container) return;

        const oldScale = scale;
        scale = Math.min(Math.max(scale + factor, 0.15), 6.0);

        const rect = viewport.getBoundingClientRect();
        const midX = rect.width / 2;
        const midY = rect.height / 2;

        translateX = midX - (midX - translateX) * (scale / oldScale);
        translateY = midY - (midY - translateY) * (scale / oldScale);

        container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    };

    window.resetZoom = function() {
        const viewport = document.querySelector('.relationship-section .diagram-outer');
        const container = document.getElementById('diagramContainer');
        if (!viewport || !container) return;

        const svg = container.querySelector('svg');
        if (svg) {
            const viewBoxStr = svg.getAttribute('viewBox');
            let nativeWidth = 900;
            let nativeHeight = 600;
            if (viewBoxStr) {
                const parts = viewBoxStr.split(/[\s,]+/).filter(Boolean);
                if (parts.length === 4) {
                    nativeWidth = parseFloat(parts[2]);
                    nativeHeight = parseFloat(parts[3]);
                }
            }

            svg.setAttribute('width', nativeWidth);
            svg.setAttribute('height', nativeHeight);
            svg.style.width = nativeWidth + 'px';
            svg.style.height = nativeHeight + 'px';
            svg.style.maxWidth = 'none';

            const outerRect = viewport.getBoundingClientRect();
            const padding = 30;

            // Fit to width for maximum readability of tall diagrams
            scale = (outerRect.width - padding) / nativeWidth;
            if (scale > 1.0) scale = 1.0; // Fit completely, don't upscale past 1x
            if (scale < 0.35) scale = 0.35; // Floor at 0.35x for mobile readability

            // Center horizontally
            translateX = (outerRect.width - nativeWidth * scale) / 2;

            // Align to top with small padding so user starts reading from the top
            translateY = 20;

            container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        } else {
            scale = 1.0;
            translateX = 0;
            translateY = 20;
            container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }
    };

    window.toggleRelationshipTheme = function() {
        const el = document.querySelector('.relationship-section');
        if (!el) return;
        const currentTheme = el.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            el.setAttribute('data-theme', 'light');
            localStorage.setItem('theme-rel', 'light');
        } else {
            el.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme-rel', 'dark');
        }
    };

    window.initRelationshipMap = function() {
        // Initialize theme from localStorage
        const el = document.querySelector('.relationship-section');
        if (el) {
            const savedTheme = localStorage.getItem('theme-rel') || 'light';
            el.setAttribute('data-theme', savedTheme);
        }

        // Initialize Mermaid
        if (window.mermaid) {
            window.mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                themeVariables: {
                    primaryColor: '#e3f2fd',
                    primaryTextColor: '#0d47a1',
                    primaryBorderColor: '#1565c0',
                    lineColor: '#718096',
                    fontSize: '18px',
                    fontFamily: 'system-ui, -apple-system, sans-serif'
                }
            });

            try {
                window.mermaid.init(undefined, document.querySelectorAll('.relationship-section .mermaid'));
            } catch (e) {
                console.error("Mermaid init failed:", e);
            }
        }

        setupPanZoom();
        // Call resetZoom multiple times to handle Mermaid rendering delays and layout shifts
        setTimeout(resetZoom, 100);
        setTimeout(resetZoom, 400);
        setTimeout(resetZoom, 1000);
    };
</script>
